name: Flatpak Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# W-MIN-13: least-privilege token (no releases created here).
permissions:
  contents: read

# W-MAJ-7: serialize tag-push Flatpak rebuilds; never cancel one in flight.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: false

# W-MIN-5: sccache/mold env mirroring ci.yml.
env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  build-binary:
    name: Build Rust Binary for Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install system deps
        # R-CRIT-1/W-CRIT-1: pipewire/drm/gbm headers (xcap 0.9 needs
        # PipeWire 1.x) + libclang-dev (bindgen via libspa-sys) — mirrors ci.yml.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libasound2-dev libspeechd-dev libpipewire-0.3-dev \
            libdrm-dev libgbm-dev libclang-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Rust binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: clickyx-release-binary
          path: src-tauri/target/release/clickyx

  flatpak:
    name: Package Flatpak
    needs: build-binary
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Download release binary
        uses: actions/download-artifact@v7
        with:
          name: clickyx-release-binary
          path: src-tauri/target/release

      - name: Make binary executable
        run: chmod +x src-tauri/target/release/clickyx

      - name: Build Flatpak
        uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: clickyx.flatpak
          manifest-path: flatpak/com.clickyx.ClickyX.yml
          cache-key: flatpak-builder-${{ github.sha }}
