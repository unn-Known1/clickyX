name: Release
on:
  push:
    tags:
      - "v*"
  # Manual re-trigger (tag delete+recreate races the startup loader and yields
  # instant "workflow file issue" failures with zero jobs — dispatch instead).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must exist)"
        required: true
        default: "v0.2.3"

permissions:
  contents: write

# W-MAJ-7: serialize tag-push releases; never cancel a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # W-MAJ-2: pre-build Rust gate — fail fast on fmt/clippy/check before
  # burning ~10 min x 3 runners on doomed tauri builds.
  gate:
    name: Rust gates (fmt + clippy + check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: gate-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            gate-cargo-

      - name: Install sccache (Rust compile cache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install mold linker (Linux)
        run: |
          sudo apt-get install -y mold
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/clang' >> $GITHUB_ENV
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> $GITHUB_ENV

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libasound2-dev libspeechd-dev libpipewire-0.3-dev libdrm-dev libgbm-dev libclang-dev

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check --all-features

      - name: Lint (clippy, deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

  build:
    name: Build ${{ matrix.os }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ''
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install sccache (Rust compile cache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install mold linker (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y mold
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/clang' >> $GITHUB_ENV
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libasound2-dev libspeechd-dev libpipewire-0.3-dev libdrm-dev libgbm-dev libclang-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        env:
          # P0-T3: bakes the trusted minisign release pubkey into the updater.
          # Empty in forks/PRs → the updater fail-closed refuses installs (documented).
          CLICKYX_UPDATE_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBKEY }}
        run: npm run tauri build ${{ startsWith(matrix.os, 'macos') && '-- --bundles dmg,app' || '' }}

      # W-MAJ-4/R-MIN-7/W-MIN-7: no unsigned .app.zip fallback — the updater
      # scorer never selects .zip, and an unsigned zip would ship without .sig.
      - name: Sign Windows artifacts
        # NOTE: `secrets.*` is not allowed in a step `if:` (the whole workflow
        # fails to parse with zero jobs) — gate on matrix only and check the
        # secret inside the script, where empty means "skip with a notice".
        if: matrix.os == 'windows-latest'
        env:
          SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_CERT)) { Write-Host "No Windows signing cert — shipping unsigned"; exit 0 }
          $certBytes = [Convert]::FromBase64String($env:SIGNING_CERT)
          $certPath = "$env:TEMP\signing.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          # P2: signtool is not on PATH by default — discover it from the SDK.
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) { $signtool = (Get-Command signtool -ErrorAction SilentlyContinue).Source }
          if (-not $signtool) { throw "signtool not found — cannot sign" }
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.msi","*.exe" | ForEach-Object {
            & $signtool sign /f $certPath /p $env:SIGNING_PASSWORD /tr https://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item $certPath -Force

      - name: Sign (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARIZATION_USERNAME: ${{ secrets.APPLE_NOTARIZATION_USERNAME }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            bash scripts/sign-macos.sh "$APPLE_SIGNING_IDENTITY"
            bash scripts/notarize-macos.sh "$APPLE_NOTARIZATION_USERNAME" "$APPLE_NOTARIZATION_PASSWORD" "" "$APPLE_TEAM_ID"
          else
            echo "No signing identity available, skipping sign"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clickyx-${{ matrix.os }}
          path: src-tauri/target/release/bundle/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Tag push and manual dispatch both land here; prefer the explicit input.
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Check if pre-release tag
        id: check
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if echo "$TAG" | grep -Eq '\-(alpha|beta|rc|pre|dev|test)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        id: changelog
        run: |
          git cliff --unreleased --tag "${{ env.RELEASE_TAG }}" --output CHANGELOG.md 2>/dev/null || true
          if [ ! -f CHANGELOG.md ] || [ ! -s CHANGELOG.md ]; then
            echo "## What's Changed" > CHANGELOG.md
          fi

      - name: Generate release notes
        id: notes
        run: |
          cat CHANGELOG.md > release-notes.md
          echo "" >> release-notes.md
          echo "### Downloads" >> release-notes.md
          echo "" >> release-notes.md
          find artifacts -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) | while read f; do
            basename=$(basename "$f")
            echo "- $basename" >> release-notes.md
          done

      - name: Sign update artifacts (minisign)
        # P0-T3: every installable artifact gets a `<file>.sig` companion.
        # The in-app updater verifies it against CLICKYX_UPDATE_PUBKEY and
        # REFUSES unsigned artifacts. Requires repo secrets:
        #   UPDATE_SIGNING_KEY_B64 = base64(minisign secret key file)
        #   UPDATE_SIGNING_PUBKEY  = minisign public key (also baked into builds)
        # Generate once: minisign -G -p update.pub -s update.key
        env:
          UPDATE_SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY_B64" ]; then
            echo "::warning::UPDATE_SIGNING_KEY_B64 not set — artifacts will ship WITHOUT .sig; the in-app updater will refuse them (fail-closed, by design)"
            exit 0
          fi
          (sudo apt-get install -y minisign 2>/dev/null || cargo install minisign --locked) 2>&1 | tail -1
          echo "$UPDATE_SIGNING_KEY_B64" | base64 -d > /tmp/update.key
          chmod 600 /tmp/update.key
          find artifacts -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) | while read f; do
            minisign -S -m "$f" -s /tmp/update.key -x "$f.sig"
            echo "signed: $f.sig"
          done
          rm -f /tmp/update.key

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ClickyX ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          # P0-T3: releases publish immediately — drafts are invisible to the
          # updater and to users (the old `draft: true` is why "v0.2.0
          # published" was false).
          draft: false
          prerelease: ${{ steps.check.outputs.prerelease }}
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            # W-MAJ-10: flatpak bundle slot. The flatpak.yml job currently
            # builds clickyx.flatpak but never uploads it as an artifact, so
            # this glob matches nothing today (decoupled by design); if the
            # Flatpak job starts uploading the bundle, it rides along here.
            artifacts/**/*.flatpak
            artifacts/**/*.sig
