name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual fast-path: skip already-green jobs to save runner minutes.
  # e.g. gh workflow run "CI/CD" --ref master -f skip-check=true -f skip-linux=true
  workflow_dispatch:
    inputs:
      skip-check:
        description: 'Skip the Check job (frontend + Rust checks already green)'
        type: boolean
        default: false
      skip-linux:
        description: 'Skip the ubuntu build leg (already green)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  check:
    name: Check
    if: ${{ inputs.skip-check != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install mold linker
        run: |
          sudo apt-get install -y mold
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/clang' >> $GITHUB_ENV
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> $GITHUB_ENV

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libasound2-dev libspeechd-dev libpipewire-0.3-dev libdrm-dev libgbm-dev
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend (ESLint)
        run: npm run lint
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Run Playwright E2E (app/chat/settings)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/app.spec.ts e2e/chat.spec.ts e2e/settings.spec.ts
        env:
          CI: true
      # NOTE: e2e/visual.spec.ts runs manually only until pixel baselines are
      # committed (see e2e/visual.spec.ts header + `npm run test:visual:update`).
      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-features
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked || true
          ~/.cargo/bin/cargo-audit --deny warnings || echo "::warning::cargo-audit found advisories (see log)"
      - name: Lint (clippy, deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

  build:
    name: Build (${{ matrix.os }})
    needs: check
    # Tolerate a skipped Check (manual skip-check) but still gate on its success;
    # optionally drop the already-green ubuntu leg (manual skip-linux).
    if: ${{ (needs.check.result == 'success' || needs.check.result == 'skipped') && (inputs.skip-linux != true || matrix.os != 'ubuntu-24.04') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ''
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Install sccache (Rust compile cache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install mold linker (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y mold
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/clang' >> $GITHUB_ENV
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libasound2-dev libspeechd-dev libpipewire-0.3-dev libdrm-dev libgbm-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests (all platforms)
        working-directory: src-tauri
        run: cargo test --all-features

      # One-shot diagnostic for the Windows test-binary startup crash
      # (STATUS_ENTRYPOINT_NOT_FOUND). Runs only when tests fail; free otherwise.
      - name: Diagnose Windows test binary (on failure)
        if: failure() && matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          $exe = Get-ChildItem target\debug\deps\clickyx_lib-*.exe | Select-Object -First 1
          Write-Host "Test binary: $($exe.FullName)"
          Write-Host "--- DLLs beside the binary ---"
          Get-ChildItem target\debug\deps\*.dll -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
          Write-Host "--- Load-time imports (non-system DLLs are suspects) ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          Write-Host "dumpbin: $dumpbin"
          & $dumpbin /IMPORTS $exe.FullName | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 60

      - name: Verify Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          try {
            $regPath = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
            $ver = (Get-ItemProperty -Path $regPath -Name "pv" -ErrorAction Stop).pv
            Write-Host "✔ WebView2 (Edge) runtime version: $ver"
          } catch {
            Write-Host "⚠ Could not determine WebView2 version — continuing anyway"
          }
          Write-Host "✔ Windows build dependencies verified"

      - name: Build Tauri app
        run: npm run tauri build ${{ startsWith(matrix.os, 'macos') && '-- --bundles dmg,app' || '' }}

      - name: Verify Linux build artifacts
        if: matrix.os == 'ubuntu-24.04'
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "=== Linux build artifacts ==="
          find "$BUNDLE_DIR" -type f -ls
          echo ""
          if [ -d "$BUNDLE_DIR/deb" ]; then
            echo "✔ .deb found"
          fi
          if [ -d "$BUNDLE_DIR/appimage" ]; then
            echo "✔ .AppImage found"
            APPIMAGE=$(ls "$BUNDLE_DIR/appimage/"*.AppImage 2>/dev/null | head -1)
            if [ -n "$APPIMAGE" ]; then
              file "$APPIMAGE"
            fi
          fi
          if [ -d "$BUNDLE_DIR/rpm" ]; then
            echo "✔ .rpm found"
          fi
          BINARY="src-tauri/target/release/clickyx"
          if [ -f "$BINARY" ]; then
            MISSING=$(ldd "$BINARY" 2>/dev/null | grep "not found" || true)
            if [ -n "$MISSING" ]; then
              echo "⚠ Missing shared library dependencies:"
              echo "$MISSING"
            else
              echo "✔ All shared library dependencies resolved"
            fi
          fi
          echo "=== Verification complete ==="

      - name: Create macOS zip (fallback)
        if: startsWith(matrix.os, 'macos')
        run: |
          cd src-tauri/target/release/bundle/macos 2>/dev/null || true
          zip -r ClickyX.app.zip ClickyX.app 2>/dev/null || true
          mv ClickyX.app.zip ../dmg/ 2>/dev/null || true

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: clickyx-linux
          path: src-tauri/target/release/bundle/

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: clickyx-windows
          path: src-tauri/target/release/bundle/

      - name: Upload artifacts (macOS ARM64)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: clickyx-macos-aarch64
          path: src-tauri/target/release/bundle/


