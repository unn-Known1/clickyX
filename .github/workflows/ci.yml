name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual fast-path: skip already-green jobs to save runner minutes.
  # e.g. gh workflow run "CI/CD" --ref master -f skip-check=true -f skip-linux=true
  workflow_dispatch:
    inputs:
      skip-check:
        description: 'Skip the Check job (frontend + Rust checks already green)'
        type: boolean
        default: false
      skip-linux:
        description: 'Skip the ubuntu build leg (already green)'
        type: boolean
        default: false

concurrency:
  # v2: previous group wedged behind an unresponsive runner (sxstrace hang);
  # bumped to let new runs initialize. Semantics unchanged.
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  check:
    name: Check
    if: ${{ inputs.skip-check != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install mold linker
        run: |
          sudo apt-get install -y mold
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/clang' >> $GITHUB_ENV
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> $GITHUB_ENV

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libasound2-dev libspeechd-dev libpipewire-0.3-dev libdrm-dev libgbm-dev
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend (ESLint)
        run: npm run lint
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Run Playwright E2E (app/chat/settings)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/app.spec.ts e2e/chat.spec.ts e2e/settings.spec.ts
        env:
          CI: true
      # NOTE: e2e/visual.spec.ts runs manually only until pixel baselines are
      # committed (see e2e/visual.spec.ts header + `npm run test:visual:update`).
      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-features
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked || true
          ~/.cargo/bin/cargo-audit --deny warnings || echo "::warning::cargo-audit found advisories (see log)"
      - name: Lint (clippy, deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

  # Resolves the build matrix so manual runs can drop the already-green
  # ubuntu leg (skip-linux). `matrix` can't be read in a job-level `if`,
  # so the OS list is computed here and consumed via fromJSON below.
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.set.outputs.os }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.skip-linux }}" = "true" ]; then
            echo 'os=["windows-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-24.04", "windows-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: [check, setup]
    # always() opts out of the default status gate so a SKIPPED check
    # (manual skip-check) doesn't propagate the skip; failed checks still gate.
    if: ${{ always() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ''
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Install sccache (Rust compile cache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install mold linker (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y mold
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/clang' >> $GITHUB_ENV
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> $GITHUB_ENV

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libasound2-dev libspeechd-dev libpipewire-0.3-dev libdrm-dev libgbm-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests (all platforms)
        working-directory: src-tauri
        run: cargo test --all-features

      # One-shot diagnostic for the Windows test-binary startup crash
      # (STATUS_ENTRYPOINT_NOT_FOUND). Runs only when tests fail; free otherwise.
      - name: Diagnose Windows test binary (on failure)
        if: failure() && matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          $exe = Get-ChildItem target\debug\deps\clickyx_lib-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "NO test binary built"; exit 0 }
          Write-Host "Test binary: $($exe.FullName)"
          Write-Host "--- Does test listing work? (no = loader crash, yes = a test crashes) ---"
          & $exe.FullName --list 2>&1 | Select-Object -First 15
          Write-Host "list exit: $LASTEXITCODE"
          Write-Host "--- dumpbin /HEADERS (machine/subsystem) ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          & $dumpbin /HEADERS $exe.FullName | Select-String 'machine|subsystem|DLL characteristics' | Select-Object -First 10
          Write-Host "--- dumpbin /HEADERS .rsrc section flags (expect 40000040 Read Only) ---"
          & $dumpbin /HEADERS $exe.FullName | Select-String -Pattern '\.rsrc' -Context 0,9 | Select-Object -First 12
          Write-Host "--- sxstrace (did SxS honor the manifest? which comctl32?) ---"
          Start-Process sxstrace -ArgumentList "trace","-logfile:$env:RUNNER_TEMP\sxs.etl" -NoNewWindow
          Start-Sleep -Seconds 3
          & $exe.FullName --list 2>&1 | Select-Object -First 3
          sxstrace stoptrace 2>&1 | Select-Object -First 3
          sxstrace parse -logfile:$env:RUNNER_TEMP\sxs.etl -outfile:$env:RUNNER_TEMP\sxs.txt 2>&1 | Select-Object -First 3
          Select-String -Path $env:RUNNER_TEMP\sxs.txt -Pattern 'comctl|Common-Controls|ERROR|error|fail|policy|version="6' -AllMatches | Select-Object -First 40
          Write-Host "--- Dependencies.exe walker (exact missing module/entrypoint) ---"
          $depzip = "$env:RUNNER_TEMP\deps.zip"
          Invoke-WebRequest -Uri "https://github.com/lucasg/Dependencies/releases/download/v1.11.1/Dependencies_x64_Release.zip" -OutFile $depzip
          Expand-Archive -Path $depzip -DestinationPath "$env:RUNNER_TEMP\deps" -Force
          & "$env:RUNNER_TEMP\deps\Dependencies.exe" -chain $exe.FullName 2>&1 | Set-Content -Path $env:RUNNER_TEMP\chain.txt
          Write-Host "--- chain lines mentioning comctl32 (WinSxS=v6 honored, System32=v5 ignored) ---"
          Select-String -Path $env:RUNNER_TEMP\chain.txt -Pattern 'comctl32' -AllMatches | Select-Object -First 20
          Write-Host "--- chain lines mentioning missing/unresolved ---"
          Select-String -Path $env:RUNNER_TEMP\chain.txt -Pattern 'not found|missing|unresolved|cannot|failed| \? ' -AllMatches | Select-Object -First 30
          Write-Host "--- chain head (root + depth 1) ---"
          Get-Content -Path $env:RUNNER_TEMP\chain.txt -TotalCount 60
          Write-Host "--- full API import list anomalies (anything Dependencies flags) ---"
          & "$env:RUNNER_TEMP\deps\Dependencies.exe" -imports $exe.FullName 2>&1 | Set-Content -Path $env:RUNNER_TEMP\imports.txt
          Select-String -Path $env:RUNNER_TEMP\imports.txt -Pattern 'NOT_FOUND|Unresolved|unresolved|MISSING|Missing|\?{2,}|ERROR' -AllMatches | Select-Object -First 30
          Write-Host "import lines total: $((Get-Content -Path $env:RUNNER_TEMP\imports.txt | Measure-Object -Line).Lines)"
          Write-Host "--- delay-load check (comctl32 must be absent from static imports) ---"
          Select-String -Path $env:RUNNER_TEMP\imports.txt -Pattern 'comctl32' -AllMatches | Select-Object -First 10
          Write-Host "--- PE resource tree (pefile) ---"
          pip install pefile --quiet 2>&1 | Select-Object -Last 1
          Set-Content -Path $env:RUNNER_TEMP\rsrc.py -Value 'import pefile,sys'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value 'pe=pefile.PE(sys.argv[1])'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value 'for e in pe.DIRECTORY_ENTRY_RESOURCE.entries:'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '    t=e.name.string.decode() if e.name else e.id'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '    print("resource-type:", t)'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '    f=e.directory.entries'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '    print("count:", len(f))'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '    for x in f:'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '        print("  id:", x.id)'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '        for g in x.directory.entries:'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '            d=g.data.struct'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '            print("    lang:", g.id, "size:", d.Size, "off:", d.OffsetToData)'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '            raw=pe.get_data(d.OffsetToData, min(d.Size, 600))'
          Add-Content -Path $env:RUNNER_TEMP\rsrc.py -Value '            print("    bytes:", raw)'
          python "$env:RUNNER_TEMP\rsrc.py" $exe.FullName
          Write-Host "--- Embedded manifest (missing comctl32 v6 => v5 loads => TaskDialogIndirect unresolvable) ---"
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "mt: $mt"
          if ($mt) { & $mt.FullName "-inputresource:$($exe.FullName);#1" "-out:$env:RUNNER_TEMP\exe.manifest"; if (Test-Path $env:RUNNER_TEMP\exe.manifest) { Get-Content $env:RUNNER_TEMP\exe.manifest } else { Write-Host "NO manifest embedded" } }

      - name: Verify Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          try {
            $regPath = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
            $ver = (Get-ItemProperty -Path $regPath -Name "pv" -ErrorAction Stop).pv
            Write-Host "✔ WebView2 (Edge) runtime version: $ver"
          } catch {
            Write-Host "⚠ Could not determine WebView2 version — continuing anyway"
          }
          Write-Host "✔ Windows build dependencies verified"

      - name: Build Tauri app
        run: npm run tauri build ${{ startsWith(matrix.os, 'macos') && '-- --bundles dmg,app' || '' }}

      - name: Verify Linux build artifacts
        if: matrix.os == 'ubuntu-24.04'
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "=== Linux build artifacts ==="
          find "$BUNDLE_DIR" -type f -ls
          echo ""
          if [ -d "$BUNDLE_DIR/deb" ]; then
            echo "✔ .deb found"
          fi
          if [ -d "$BUNDLE_DIR/appimage" ]; then
            echo "✔ .AppImage found"
            APPIMAGE=$(ls "$BUNDLE_DIR/appimage/"*.AppImage 2>/dev/null | head -1)
            if [ -n "$APPIMAGE" ]; then
              file "$APPIMAGE"
            fi
          fi
          if [ -d "$BUNDLE_DIR/rpm" ]; then
            echo "✔ .rpm found"
          fi
          BINARY="src-tauri/target/release/clickyx"
          if [ -f "$BINARY" ]; then
            MISSING=$(ldd "$BINARY" 2>/dev/null | grep "not found" || true)
            if [ -n "$MISSING" ]; then
              echo "⚠ Missing shared library dependencies:"
              echo "$MISSING"
            else
              echo "✔ All shared library dependencies resolved"
            fi
          fi
          echo "=== Verification complete ==="

      - name: Create macOS zip (fallback)
        if: startsWith(matrix.os, 'macos')
        run: |
          cd src-tauri/target/release/bundle/macos 2>/dev/null || true
          zip -r ClickyX.app.zip ClickyX.app 2>/dev/null || true
          mv ClickyX.app.zip ../dmg/ 2>/dev/null || true

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: clickyx-linux
          path: src-tauri/target/release/bundle/

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: clickyx-windows
          path: src-tauri/target/release/bundle/

      - name: Upload artifacts (macOS ARM64)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: clickyx-macos-aarch64
          path: src-tauri/target/release/bundle/


